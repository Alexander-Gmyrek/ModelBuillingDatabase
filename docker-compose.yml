services:
  db:
    image: mysql:8.4
    container_name: billing-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Root
      MYSQL_DATABASE: modelBillingDBv1
    ports:
      - "3307:3306"
    volumes:
      - billing-db-data:/var/lib/mysql
      - ./Backend/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pRoot"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    environment:
      - NGINX_HOST=frontend
      - NGINX_PORT=80
    
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=modelBillingDBv1
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Root
    volumes:
      - ./Backend:/app

volumes:
  billing-db-data:
