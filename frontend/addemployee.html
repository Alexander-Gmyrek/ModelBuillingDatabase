<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
<link rel="stylesheet" href="app.css?v=20260606d">
</head>
<body>
    <h1>Add Employee</h1>
    <p class="app-page-intro">Enter the employee's enrollment details. Add dependents only when they should be included on the employee's coverage.</p>

    <form id="employeeForm">
        <label for="employeeFullName">Full Name</label>
        <input type="text" id="employeeFullName" name="EmployeeFullName" required>

        <label for="joinDate">Start Date</label>
        <input type="date" id="joinDate" name="StartDate" required>

        <label for="informJoinDate">Inform Start Date</label>
        <input type="date" id="informJoinDate" name="InformStartDate" required>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="DOB">

        <label for="notes">Notes</label>
        <input type="text" id="notes" name="Notes">

        <label for="carrier">Carrier</label>
        <select id="carrier" name="Carrier" required>
            <option value="">Select a carrier</option>
        </select>

        <label for="tier">Tier</label>
        <select id="tier" name="Tier">
            <option value="">Select a tier</option>
        </select>

        <div id="companyInfoInputs"></div>

        <h2>Dependents</h2>
        <p class="app-page-intro">Leave the dependent row blank if this employee has no dependents.</p>
        <table id="editableTable">
            <thead>
                <tr>
                    <th>Dependent Name</th>
                    <th>Relationship</th>
                    <th>Date of Birth</th>
                    <th>Start Date</th>
                    <th>Inform Start Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <button type="button" id="addDependentRow" class="secondary">Add Dependent</button>
        <button type="submit">Submit</button>
        <button type="button" id="cancelButton" class="secondary">Cancel</button>
    </form>

    <script type="module">
        import {
            addEmployee,
            getFullTable
        } from './apiFunctions.js';

        const urlParams = new URLSearchParams(window.location.search);
        const companyId = urlParams.get('id');
        let company = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!companyId) {
                alert('No company ID was provided.');
                window.location.href = 'index.html';
                return;
            }

            try {
                const companyResponse = await getFullTable('Employer', companyId);
                company = companyResponse.Element;
                displayCompanyInfoInputs(company);
                populatePlanDropdowns(company);
                addRow();
            } catch (error) {
                console.error('Error fetching company details:', error);
                alert('Could not load company details.');
            }
        });

        document.getElementById('addDependentRow').addEventListener('click', () => addRow());
        document.getElementById('cancelButton').addEventListener('click', () => {
            window.location.href = `company1.html?id=${encodeURIComponent(companyId)}`;
        });

        document.getElementById('employeeForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const employee = buildEmployeeJson();
            if (!employee.EmployeeFullName || !employee.StartDate || !employee.InformStartDate) {
                alert('Full name, start date, and inform start date are required.');
                return;
            }

            try {
                await addEmployee(employee);
                alert('Employee added successfully.');
                window.location.href = `company1.html?id=${encodeURIComponent(companyId)}`;
            } catch (error) {
                console.error('Error adding employee:', error);
                alert(`Failed to add employee. ${error.message || ''}`);
            }
        });

        function displayCompanyInfoInputs(companyData) {
            const container = document.getElementById('companyInfoInputs');
            container.innerHTML = '';

            [
                ['GlCode', 'GL Code', companyData.UsesGlCode],
                ['Division', 'Division', companyData.UsesDivision],
                ['Location', 'Location', companyData.UsesLocation],
                ['Title', 'Title', companyData.UsesTitle]
            ].forEach(([name, label, enabled]) => {
                if (enabled === 0 || enabled === false) return;
                const labelElement = document.createElement('label');
                labelElement.htmlFor = name;
                labelElement.textContent = label;
                const input = document.createElement('input');
                input.type = 'text';
                input.id = name;
                input.name = name;
                container.appendChild(labelElement);
                container.appendChild(input);
            });

            const cobraLabel = document.createElement('label');
            cobraLabel.htmlFor = 'CobraStatus';
            cobraLabel.textContent = 'COBRA Status';
            const cobraInput = document.createElement('input');
            cobraInput.type = 'checkbox';
            cobraInput.id = 'CobraStatus';
            cobraInput.name = 'CobraStatus';
            cobraInput.style.width = 'auto';
            container.appendChild(cobraLabel);
            container.appendChild(cobraInput);
        }

        function populatePlanDropdowns(companyData) {
            const carrierSelect = document.getElementById('carrier');
            const tierSelect = document.getElementById('tier');

            (companyData.Carriers || []).forEach(carrier => {
                const option = document.createElement('option');
                option.value = carrier.CarrierName;
                option.textContent = carrier.CarrierName;
                carrierSelect.appendChild(option);
            });

            (companyData.Tiers || []).forEach(tier => {
                const option = document.createElement('option');
                option.value = tier.TierName;
                option.textContent = tier.TierName;
                tierSelect.appendChild(option);
            });
        }

        function buildEmployeeJson() {
            const formData = new FormData(document.getElementById('employeeForm'));
            const employee = {
                EmployerID: Number(companyId),
                EmployeeFullName: formData.get('EmployeeFullName') || null,
                StartDate: formData.get('StartDate') || null,
                InformStartDate: formData.get('InformStartDate') || formData.get('StartDate') || null,
                DOB: formData.get('DOB') || null,
                CobraStatus: document.getElementById('CobraStatus')?.checked || false,
                Notes: formData.get('Notes') || null,
                GlCode: formData.get('GlCode') || null,
                Division: formData.get('Division') || null,
                Location: formData.get('Location') || null,
                Title: formData.get('Title') || null,
                Carrier: formData.get('Carrier') || null,
                Tier: formData.get('Tier') || null,
                Dependents: gatherDependents(formData.get('StartDate'), formData.get('InformStartDate'))
            };

            const nameParts = employee.EmployeeFullName.trim().split(/\s+/);
            employee.EmployeeFirstName = nameParts[0] || null;
            employee.EmployeeLastName = nameParts.length > 1 ? nameParts[nameParts.length - 1] : null;

            return employee;
        }

        function gatherDependents(defaultStartDate, defaultInformStartDate) {
            return Array.from(document.querySelectorAll('#editableTable tbody tr')).map(row => {
                const dependentName = row.querySelector('[name="dependentName"]').value.trim();
                const relationship = row.querySelector('[name="dependentRelationship"]').value.trim();
                const dob = row.querySelector('[name="dependentDOB"]').value;
                const startDate = row.querySelector('[name="dependentStartDate"]').value || defaultStartDate;
                const informStartDate = row.querySelector('[name="dependentInformStartDate"]').value || defaultInformStartDate || startDate;

                if (!dependentName && !relationship && !dob) return null;
                if (!dependentName || !relationship || !dob) {
                    throw new Error('Each dependent needs a name, relationship, and date of birth.');
                }

                return {
                    DependentName: dependentName,
                    Relationship: relationship,
                    DOB: dob,
                    StartDate: startDate,
                    InformStartDate: informStartDate
                };
            }).filter(Boolean);
        }

        function addRow() {
            const table = document.getElementById('editableTable').querySelector('tbody');
            const row = table.insertRow();
            row.innerHTML = `
                <td><input type="text" name="dependentName"></td>
                <td><input type="text" name="dependentRelationship"></td>
                <td><input type="date" name="dependentDOB"></td>
                <td><input type="date" name="dependentStartDate"></td>
                <td><input type="date" name="dependentInformStartDate"></td>
                <td><button type="button" onclick="deleteRow(this)">Delete</button></td>
            `;
        }

        function deleteRow(button) {
            button.closest('tr').remove();
        }

        window.addRow = addRow;
        window.deleteRow = deleteRow;
    </script>
    <script src="app-shell.js?v=20260606b" defer></script>
</body>
</html>
