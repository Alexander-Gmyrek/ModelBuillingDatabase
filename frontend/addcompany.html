<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Company - Billing Database</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.3/xlsx.full.min.js"></script>
<link rel="stylesheet" href="app.css?v=20260606d">
</head>
<body>
    <header>
        <h1>New Company</h1>
        <p>Create a company and set up its carriers, tiers, and plan amounts. Employee uploads are optional.</p>
    </header>
    <form id="companyForm">
        <div class="app-form-grid">
        <div>
        <label for="EmployerName">Company name</label>
        <input type="text" id="EmployerName" name="EmployerName" placeholder="ACME Benefits Group">
        </div>
        
        <div>
        <label for="file">Employee template file (optional)</label>
        <input type="file" id="file" name="file">
        <p class="note"><a href="assets/employee_upload_template.xlsx" download>Download the employee upload template</a></p>
        </div>
        
        <div>
        <label for="RenewalDate">Renewal date <small class="note">(Sets the default plan start month. Use a month on or before the earliest employee start date if these rates applied then.)</small></label>
        <input type="text" id="RenewalDate" name="RenewalDate" placeholder="YYYY-MM" pattern="(?:19[0-9]{2}|2[0-3][0-9]{2}|2400)-(?:0[1-9]|1[0-2])" maxlength="7" required title="Enter a year from 1900 to 2400 and a two-digit month, such as 2026-11">
        </div>
        
        <div>
        <label for="BillingDate">Preferred billing date <small class="note">(Your preferred billing month, stored for reference. Choose the intended first billing month; it does not need to precede employee start dates.)</small></label>
        <input type="text" id="BillingDate" name="BillingDate" placeholder="YYYY-MM" pattern="(?:19[0-9]{2}|2[0-3][0-9]{2}|2400)-(?:0[1-9]|1[0-2])" maxlength="7" required title="Enter a year from 1900 to 2400 and a two-digit month, such as 2026-11">
        </div>
        
        <div class="app-full-row">
        <h4>Tier structure</h4>
        <div class="radio-group">
            <input type="radio" id="tier3" name="TierStructure" value="3 Tier">
            <label for="tier3" class="radio-label">3 Tier</label>
            
            <input type="radio" id="tier4" name="TierStructure" value="4 Tier">
            <label for="tier4" class="radio-label">4 Tier</label>
            
            <input type="radio" id="supercomposite" name="TierStructure" value="Supercomposite">
            <label for="supercomposite" class="radio-label">Supercomposite</label>
            
            <input type="radio" id="ageBanded" name="TierStructure" value="Age Banded">
            <label for="ageBanded" class="radio-label">Age Banded</label>
            
            <input type="radio" id="ageBandedTiered" name="TierStructure" value="Age Banded Tiered">
            <label for="ageBandedTiered" class="radio-label">Age Banded Tiered</label>
        </div>
        </div>

        <div class="app-full-row">
        <input type="checkbox" id="autogenerate" name="autogenerate" value="autogenerate">
        <label for="autogenerate">Auto-build carrier and tier tables from the uploaded employee file</label>
        </div>
        
        <div class="app-full-row">
            <button type="submit">Continue To Plan Setup</button>
            <a class="button secondary" href="index.html?v=20260606c">Cancel</a>
        </div>
        </div>
    </form>
    <script src="employee-import.js?v=20261117b"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Handle form submission
            document.getElementById('companyForm').addEventListener('submit', async function(event) {
                event.preventDefault(); // Prevent the default form submission
                if (this.dataset.submitting) return;
                this.dataset.submitting = 'true';
                const submitButton = this.querySelector('button[type="submit"]');
                submitButton.disabled = true;
                try {

                // Retrieve form data
                const formData = new FormData(this);
                const data = {};

                // Extract company name
                data['EmployerName'] = formData.get('EmployerName');

                // Extract renewal date
                data['RenewalDate'] = monthToDate(formData.get('RenewalDate'));

                // Extract preferred billing date
                data['PerferedBillingDate'] = monthToDate(formData.get('BillingDate'));

                // Extract tier
                let tier = formData.get('TierStructure');
                if (tier === 'Age Banded Tiered') {
                    tier = 'Age Banded Composite'; // Change Age Banded Tiered to Age Banded Composite
                }
                data['TierStructure'] = tier;

                // Extract and parse the Excel file
                const file = formData.get('file');
                try {
                    data['Employees'] = file?.size ? await readEmployeeSpreadsheet(file) : [];
                } catch (error) {
                    alert(`Could not read the employee spreadsheet. ${error.message}`);
                    return;
                }

                // Validate the data
                if (!data['EmployerName']) {
                    alert('Please enter the company name');
                    return;
                }
                if (!data['RenewalDate']) {
                    alert('Please enter the renewal date');
                    return;
                }
                if (!data['PerferedBillingDate']) {
                    alert('Please enter the preferred billing date');
                    return;
                }
                if (!data['TierStructure']) {
                    alert('Please select a tier structure');
                    return;
                }
                if (data['TierStructure'] === 'Age Banded' && data['Employees'].some(e => !e.DOB)) {
                    alert('Please ensure all employees have a Date of Birth');
                    return;
                }
                if (data['TierStructure'] === 'Age Banded Composite' && data['Employees'].some(e => !e.DOB)) {
                    alert('Please ensure all employees have a Date of Birth');
                    return;
                }
                if (data['Employees'].some(e => !e.Tier)) {
                    alert('Not all employees have a Tier. Continue?');
                    //return;
                }
                if (data['Employees'].some(e => !e.Carrier)) {
                    alert('Not all employees have a Carrier. Continue?');
                    //return;
                }
                // parse the year from perfered billing date
                const PerferedBillingYear = new Date(data["PerferedBillingDate"]).getFullYear();
                if (PerferedBillingYear > 2400 || PerferedBillingYear < 1900) {
                    alert('Prefered Billing Date should must be a valid date before the year 2400 and after 1900.');
                    return;
                }

                if (data.Employees.length && !await showEmployeeImportPreview(data.Employees)) return;

                // Store data locally
                localStorage.setItem('companyData', JSON.stringify(data));

                // Determine the next page based on the selected tier
                let nextPage;
                switch (data['TierStructure']) {
                    case '3 Tier':
                        nextPage = 'maketier3table.html';
                        break;
                    case '4 Tier':
                        nextPage = 'maketier4table.html';
                        break;
                    case 'Supercomposite':
                        nextPage = 'makesupertable.html';
                        break;
                    case 'Age Banded':
                        nextPage = 'makeagetable.html';
                        break;
                    case 'Age Banded Composite': // Redirect Age Banded Composite to the appropriate page
                        nextPage = 'makeagetiertable.html';
                        break;
                    default:
                        alert('Please select a valid tier structure.');
                        return;
                }

                // Check if the autogenerate checkbox is checked
                const autogenerate = data.Employees.length > 0 && formData.get('autogenerate') === 'autogenerate';

                if(autogenerate == true){
                    const tiers = []
                    const carriers = []
                    data['Employees'].forEach(employee => {
                        if (!tiers.includes(employee.Tier)) {
                            tiers.push(employee.Tier);
                        }
                        if (!carriers.includes(employee.Carrier)) {
                            carriers.push(employee.Carrier);
                        }
                    });
                    // Tiers should be formated as: { TierName: 'Employee', MaxAge: '', MinAge: '' },
                    // CarrierData should be formated as: 'CarrierName': {
                        //'T1': { 'Funding Amount': '', 'Grenz Fee': '', 'Grenz Fee C': '', 'Grenz Fee S': '' },
                        //'T2': { 'Funding Amount': '', 'Grenz Fee': '', 'Grenz Fee C': '', 'Grenz Fee S': '' }
                    // }
                    // Carries should be formated as: [{ CarrierName: 'C1' }]
                    const formatedBasicCarriers = []
                    carriers.forEach(carrier => {
                        formatedBasicCarriers.push({ CarrierName: carrier });
                    });
                    const formatedTiers = []
                    tiers.forEach(tier => {
                        formatedTiers.push({ TierName: tier, MaxAge: '', MinAge: '' });
                    });
                    const formatedCarriers = {}
                    carriers.forEach(carrier => {
                        formatedCarriers[carrier] = {}
                        tiers.forEach(tier => {
                            formatedCarriers[carrier][tier] = { 'Funding Amount': '', 'Grenz Fee': '', 'Grenz Fee C': '', 'Grenz Fee S': '' }
                        });
                    });
                    localStorage.setItem('tiers', JSON.stringify(formatedTiers));
                    localStorage.setItem('carriers', JSON.stringify(formatedBasicCarriers));
                    localStorage.setItem('carrierData', JSON.stringify(formatedCarriers));
                    nextPage = 'makeautogeneratetable.html';
                }

                // Redirect to the next page
                window.location.href = window.billingPageUrl(nextPage);
                } catch (error) {
                    alert(error.message || 'Could not prepare company setup.');
                } finally {
                    delete this.dataset.submitting;
                    submitButton.disabled = false;
                }
            });

        });

    </script>
    <script src="app-shell.js?v=20260606c" defer></script>
</body>
</html>
