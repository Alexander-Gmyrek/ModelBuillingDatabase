<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>
<link rel="stylesheet" href="app.css?v=20260606d">
</head>
<body>
    <h1>Edit Employee</h1>
    <p class="app-page-intro">Update employee details, dependent records, or mark the employee terminated. Termination also ends active dependent and plan records.</p>

    <form id="employeeForm">
        <label for="employeeFullName">Full Name</label>
        <input type="text" id="employeeFullName" name="EmployeeFullName" required>

        <label for="joinDate">Start Date</label>
        <input type="date" id="joinDate" name="StartDate">

        <label for="informJoinDate">Inform Start Date</label>
        <input type="date" id="informJoinDate" name="InformStartDate">

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="DOB">

        <label for="notes">Notes</label>
        <input type="text" id="notes" name="Notes">

        <div id="companyInfoInputs"></div>

        <h2>Dependents</h2>
        <table id="editableTable">
            <thead>
                <tr>
                    <th>Dependent Name</th>
                    <th>Relationship</th>
                    <th>Date of Birth</th>
                    <th>Start Date</th>
                    <th>Inform Start Date</th>
                    <th>End Date</th>
                    <th>Inform End Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <button type="button" id="addDependentRow" class="secondary">Add Dependent</button>

        <label>
            <input type="checkbox" id="terminationCheckbox" name="terminationCheckbox">
            Termination
        </label>

        <label for="termDate">Term Date</label>
        <input type="date" id="termDate" name="termDate" disabled>

        <label for="informedTermDate">Informed Term Date</label>
        <input type="date" id="informedTermDate" name="informedTermDate" disabled>

        <div>
            <input type="submit" value="Save Employee">
            <button type="button" id="cancelButton" class="secondary">Back To Company</button>
        </div>
    </form>

    <script type="module">
        import {
            searchEmployeeById,
            changeEmployee,
            terminateEmployee,
            searchDependentByJson,
            addDependent,
            changeDependent
        } from './apiFunctions.js';

        const urlParams = new URLSearchParams(window.location.search);
        const employeeId = urlParams.get('id');
        let loadedEmployee = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!employeeId) {
                alert('No employee ID was provided.');
                window.location.href = window.billingPageUrl('index.html');
                return;
            }

            try {
                loadedEmployee = await searchEmployeeById(employeeId);
                const dependents = await searchDependentByJson({ EmployeeID: employeeId });
                populateForm(loadedEmployee, dependents);
            } catch (error) {
                console.error('Error loading employee:', error);
                alert('Could not load employee details.');
            }
        });

        document.getElementById('terminationCheckbox').addEventListener('change', function() {
            document.getElementById('termDate').disabled = !this.checked;
            document.getElementById('informedTermDate').disabled = !this.checked;
        });

        document.getElementById('addDependentRow').addEventListener('click', () => addRow());
        document.getElementById('cancelButton').addEventListener('click', () => goBackToCompany());

        document.getElementById('employeeForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const employeeJson = buildEmployeeUpdateJson();

            try {
                await changeEmployee(employeeId, employeeJson);
                await saveDependentRows();

                if (document.getElementById('terminationCheckbox').checked) {
                    const endDate = document.getElementById('termDate').value;
                    const informEndDate = document.getElementById('informedTermDate').value || endDate;
                    if (!endDate) {
                        alert('Termination date is required when Termination is checked.');
                        return;
                    }
                    await terminateEmployee(employeeId, {
                        EndDate: endDate,
                        InformEndDate: informEndDate
                    });
                }

                alert('Employee information updated successfully.');
                goBackToCompany();
            } catch (error) {
                console.error('Error updating employee information:', error);
                alert(`Failed to update employee information. ${error.message || ''}`);
            }
        });

        function buildEmployeeUpdateJson() {
            const formData = new FormData(document.getElementById('employeeForm'));
            return {
                EmployeeFullName: formData.get('EmployeeFullName') || null,
                StartDate: formData.get('StartDate') || null,
                InformStartDate: formData.get('InformStartDate') || null,
                DOB: formData.get('DOB') || null,
                Notes: formData.get('Notes') || null,
                GlCode: formData.get('GlCode') || null,
                Division: formData.get('Division') || null,
                Location: formData.get('Location') || null,
                Title: formData.get('Title') || null,
                CobraStatus: document.getElementById('CobraStatus')?.checked || false
            };
        }

        async function saveDependentRows() {
            const rows = Array.from(document.querySelectorAll('#editableTable tbody tr'));
            for (const row of rows) {
                const dependent = dependentFromRow(row);
                if (!dependent) continue;

                if (dependent.DependentID) {
                    const id = dependent.DependentID;
                    delete dependent.DependentID;
                    await changeDependent(id, dependent);
                } else {
                    await addDependent(dependent);
                }
            }
        }

        function dependentFromRow(row) {
            const dependentName = row.querySelector('[name="dependentName"]').value.trim();
            const relationship = row.querySelector('[name="dependentRelationship"]').value.trim();
            const dob = row.querySelector('[name="dependentDOB"]').value;
            if (!dependentName && !relationship && !dob) return null;

            return {
                DependentID: row.dataset.dependentId || null,
                EmployeeID: Number(employeeId),
                DependentName: dependentName,
                Relationship: relationship,
                DOB: dob,
                StartDate: row.querySelector('[name="StartDate"]').value || document.getElementById('joinDate').value,
                InformStartDate: row.querySelector('[name="InformStartDate"]').value || document.getElementById('informJoinDate').value,
                EndDate: row.querySelector('[name="EndDate"]').value || null,
                InformEndDate: row.querySelector('[name="InformEndDate"]').value || null
            };
        }

        function populateForm(employee, dependents) {
            document.getElementById('employeeFullName').value = employee.EmployeeFullName || '';
            document.getElementById('joinDate').value = formatDate(employee.StartDate);
            document.getElementById('informJoinDate').value = formatDate(employee.InformStartDate);
            document.getElementById('dob').value = formatDate(employee.DOB);
            document.getElementById('notes').value = employee.Notes || '';

            addCompanyInput('GlCode', 'GL Code', employee.GlCode);
            addCompanyInput('Division', 'Division', employee.Division);
            addCompanyInput('Location', 'Location', employee.Location);
            addCompanyInput('Title', 'Title', employee.Title);
            addCheckboxInput('CobraStatus', 'COBRA Status', Boolean(employee.CobraStatus));

            dependents.forEach(addDependentRow);
            if (dependents.length === 0) addRow();
        }

        function addCompanyInput(name, labelText, value) {
            const container = document.getElementById('companyInfoInputs');
            const label = document.createElement('label');
            label.htmlFor = name;
            label.textContent = labelText;
            const input = document.createElement('input');
            input.type = 'text';
            input.id = name;
            input.name = name;
            input.value = value || '';
            container.appendChild(label);
            container.appendChild(input);
        }

        function addCheckboxInput(name, labelText, checked) {
            const container = document.getElementById('companyInfoInputs');
            const label = document.createElement('label');
            label.htmlFor = name;
            label.textContent = labelText;
            const input = document.createElement('input');
            input.type = 'checkbox';
            input.id = name;
            input.name = name;
            input.checked = checked;
            input.style.width = 'auto';
            container.appendChild(label);
            container.appendChild(input);
        }

        function addDependentRow(dependent) {
            const table = document.getElementById('editableTable').querySelector('tbody');
            const row = table.insertRow();
            row.dataset.dependentId = dependent.DependentID || '';
            row.innerHTML = `
                <td><input type="text" name="dependentName" value="${escapeHtml(dependent.DependentName || '')}"></td>
                <td><input type="text" name="dependentRelationship" value="${escapeHtml(dependent.Relationship || '')}"></td>
                <td><input type="date" name="dependentDOB" value="${formatDate(dependent.DOB)}"></td>
                <td><input type="date" name="StartDate" value="${formatDate(dependent.StartDate)}"></td>
                <td><input type="date" name="InformStartDate" value="${formatDate(dependent.InformStartDate)}"></td>
                <td><input type="date" name="EndDate" value="${formatDate(dependent.EndDate)}"></td>
                <td><input type="date" name="InformEndDate" value="${formatDate(dependent.InformEndDate)}"></td>
                <td><button type="button" onclick="deleteRow(this)">Delete</button></td>
            `;
        }

        function addRow() {
            addDependentRow({});
        }

        function deleteRow(button) {
            button.closest('tr').remove();
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const value = String(dateString);
            if (/^\d{4}-\d{2}-\d{2}/.test(value)) return value.slice(0, 10);
            const parsed = new Date(value);
            return Number.isNaN(parsed.getTime()) ? '' : parsed.toISOString().slice(0, 10);
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function goBackToCompany() {
            const employerId = loadedEmployee?.EmployerID;
            window.location.href = employerId ? window.billingPageUrl(`company1.html?id=${encodeURIComponent(employerId)}`) : window.billingPageUrl('index.html');
        }

        window.addRow = addRow;
        window.deleteRow = deleteRow;
    </script>
    <script src="app-shell.js?v=20260606c" defer></script>
</body>
</html>
