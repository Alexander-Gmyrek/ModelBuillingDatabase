<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Plans - Billing Database</title>
    <link rel="stylesheet" href="app.css?v=20260606d">
</head>
<body>
    <main>
        <h1>Edit Carriers, Tiers, And Plans</h1>
        <p class="app-page-intro">Update the plan setup for this company. Saving will update current plans and end active plans that are removed from the grid.</p>

        <section class="app-card">
            <div class="maintenance-header">
                <div>
                    <label for="effectiveDate">Effective date for new or removed plans</label>
                    <input type="date" id="effectiveDate">
                </div>
                <div class="actions">
                    <button id="addCarrierButton">Add Carrier</button>
                    <button id="addTierButton">Add Tier</button>
                    <button id="submitButton">Save Plan Setup</button>
                    <a id="backButton" class="button secondary" href="index.html">Back To Company</a>
                </div>
            </div>
            <p id="statusMessage" class="app-message">Loading plan setup...</p>
            <div id="tableContainer"></div>
        </section>
    </main>

    <script type="module">
        import {
            getFullTable,
            searchActivePlans,
            saveEmployerPlanSetup
        } from './apiFunctions.js';

        const urlParams = new URLSearchParams(window.location.search);
        const employerID = urlParams.get('id');
        const statusMessage = document.getElementById('statusMessage');
        const tableContainer = document.getElementById('tableContainer');
        const effectiveDateInput = document.getElementById('effectiveDate');
        const backButton = document.getElementById('backButton');

        let carriers = [];
        let tiers = [];
        let planCells = new Map();

        document.addEventListener('DOMContentLoaded', async () => {
            effectiveDateInput.value = new Date().toISOString().slice(0, 10);

            if (!employerID) {
                statusMessage.textContent = 'No company was selected. Return to Companies and choose a company.';
                return;
            }

            backButton.href = `company1.html?id=${encodeURIComponent(employerID)}`;

            document.getElementById('addCarrierButton').addEventListener('click', addCarrier);
            document.getElementById('addTierButton').addEventListener('click', addTier);
            document.getElementById('submitButton').addEventListener('click', submitTable);

            await loadPlanSetup();
        });

        async function loadPlanSetup() {
            try {
                statusMessage.textContent = 'Loading plan setup...';
                const fullResponse = await getFullTable('Employer', employerID);
                const fullData = fullResponse.Element;
                const activePlansResponse = await searchActivePlans(employerID);
                const activePlanIds = new Set(activePlansResponse.map(plan => Array.isArray(plan) ? plan[0] : typeof plan === 'object' ? plan.PlanID : plan));

                carriers = (fullData.Carriers || []).map(carrier => ({
                    id: carrier.CarrierID,
                    clientId: `carrier-${carrier.CarrierID}`,
                    name: carrier.CarrierName
                }));

                tiers = (fullData.Tiers || []).map(tier => ({
                    id: tier.TierID,
                    clientId: `tier-${tier.TierID}`,
                    name: tier.TierName,
                    maxAge: tier.MaxAge ?? '',
                    minAge: tier.MinAge ?? ''
                }));

                planCells = new Map();
                (fullData.Plans || [])
                    .filter(plan => activePlanIds.has(plan.PlanID))
                    .forEach(plan => {
                        const carrier = carriers.find(item => item.id === plan.CarrierID);
                        const tier = tiers.find(item => item.id === plan.TierID);
                        if (!carrier || !tier) return;
                        planCells.set(cellKey(carrier.clientId, tier.clientId), {
                            planId: plan.PlanID,
                            fundingAmount: plan.FundingAmount ?? '',
                            grenzFee: plan.GrenzFee ?? '',
                            grenzFeeC: plan.GrenzFeeC ?? '',
                            grenzFeeS: plan.GrenzFeeS ?? '',
                            startDate: formatDate(plan.StartDate) || effectiveDateInput.value
                        });
                    });

                ensureAllCells();
                renderTables();
                statusMessage.textContent = 'Review plan amounts, then save when finished.';
            } catch (error) {
                console.error('Error loading plan setup:', error);
                statusMessage.textContent = 'Could not load plan setup.';
            }
        }

        function addCarrier() {
            const index = carriers.length + 1;
            const carrier = {
                id: -1,
                clientId: `new-carrier-${Date.now()}`,
                name: `New Carrier ${index}`
            };
            carriers.push(carrier);
            ensureAllCells();
            renderTables();
        }

        function addTier() {
            const index = tiers.length + 1;
            const tier = {
                id: -1,
                clientId: `new-tier-${Date.now()}`,
                name: `New Tier ${index}`,
                maxAge: '',
                minAge: ''
            };
            tiers.push(tier);
            ensureAllCells();
            renderTables();
        }

        function removeCarrier(clientId) {
            const carrier = carriers.find(item => item.clientId === clientId);
            if (!carrier) return;
            const confirmed = confirm(`Remove ${carrier.name} from the active plan setup? Historical plan records will be preserved.`);
            if (!confirmed) return;
            carriers = carriers.filter(item => item.clientId !== clientId);
            renderTables();
        }

        function removeTier(clientId) {
            const tier = tiers.find(item => item.clientId === clientId);
            if (!tier) return;
            const confirmed = confirm(`Remove ${tier.name} from the active plan setup? Historical plan records will be preserved.`);
            if (!confirmed) return;
            tiers = tiers.filter(item => item.clientId !== clientId);
            renderTables();
        }

        function ensureAllCells() {
            carriers.forEach(carrier => {
                tiers.forEach(tier => {
                    const key = cellKey(carrier.clientId, tier.clientId);
                    if (!planCells.has(key)) {
                        planCells.set(key, {
                            planId: -1,
                            fundingAmount: '',
                            grenzFee: '',
                            grenzFeeC: '',
                            grenzFeeS: '',
                            startDate: effectiveDateInput.value
                        });
                    }
                });
            });
        }

        function renderTables() {
            tableContainer.innerHTML = '';

            if (carriers.length === 0 || tiers.length === 0) {
                tableContainer.innerHTML = '<p class="app-message">Add at least one carrier and one tier to build plans.</p>';
                return;
            }

            carriers.forEach(carrier => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tableWrapper';
                wrapper.innerHTML = `
                    <div class="carrier-heading">
                        <input type="text" value="${escapeHtml(carrier.name)}" data-carrier-name="${carrier.clientId}">
                        <button type="button" data-remove-carrier="${carrier.clientId}" data-danger="true">Remove Carrier</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Plan Field</th>
                                ${tiers.map(tier => `
                                    <th>
                                        <input type="text" value="${escapeHtml(tier.name)}" data-tier-name="${tier.clientId}">
                                        <button type="button" data-remove-tier="${tier.clientId}" data-danger="true">Remove Tier</button>
                                    </th>
                                `).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            ${renderPlanRow(carrier, 'Funding Amount', 'fundingAmount')}
                            ${renderPlanRow(carrier, 'Grenz Fee', 'grenzFee')}
                            ${renderPlanRow(carrier, 'Grenz Fee C', 'grenzFeeC')}
                            ${renderPlanRow(carrier, 'Grenz Fee S', 'grenzFeeS')}
                            ${renderPlanRow(carrier, 'Plan Start Date', 'startDate', 'date')}
                            <tr>
                                <td>Tier Max Age</td>
                                ${tiers.map(tier => `<td><input type="number" value="${escapeHtml(tier.maxAge)}" data-tier-age="${tier.clientId}" data-field="maxAge"></td>`).join('')}
                            </tr>
                            <tr>
                                <td>Tier Min Age</td>
                                ${tiers.map(tier => `<td><input type="number" value="${escapeHtml(tier.minAge)}" data-tier-age="${tier.clientId}" data-field="minAge"></td>`).join('')}
                            </tr>
                        </tbody>
                    </table>
                `;
                tableContainer.appendChild(wrapper);
            });

            bindTableInputs();
        }

        function renderPlanRow(carrier, label, field, type = 'number') {
            return `
                <tr>
                    <td>${label}</td>
                    ${tiers.map(tier => {
                        const cell = planCells.get(cellKey(carrier.clientId, tier.clientId));
                        return `<td><input type="${type}" step="0.01" value="${escapeHtml(cell?.[field] ?? '')}" data-plan-field="${field}" data-carrier="${carrier.clientId}" data-tier="${tier.clientId}"></td>`;
                    }).join('')}
                </tr>
            `;
        }

        function bindTableInputs() {
            document.querySelectorAll('[data-carrier-name]').forEach(input => {
                input.addEventListener('input', event => {
                    const carrier = carriers.find(item => item.clientId === event.target.dataset.carrierName);
                    if (carrier) carrier.name = event.target.value;
                });
            });

            document.querySelectorAll('[data-tier-name]').forEach(input => {
                input.addEventListener('input', event => {
                    const tier = tiers.find(item => item.clientId === event.target.dataset.tierName);
                    if (tier) tier.name = event.target.value;
                });
            });

            document.querySelectorAll('[data-tier-age]').forEach(input => {
                input.addEventListener('input', event => {
                    const tier = tiers.find(item => item.clientId === event.target.dataset.tierAge);
                    if (tier) tier[event.target.dataset.field] = event.target.value;
                });
            });

            document.querySelectorAll('[data-plan-field]').forEach(input => {
                input.addEventListener('input', event => {
                    const key = cellKey(event.target.dataset.carrier, event.target.dataset.tier);
                    const cell = planCells.get(key);
                    if (cell) cell[event.target.dataset.planField] = event.target.value;
                });
            });

            document.querySelectorAll('[data-remove-carrier]').forEach(button => {
                button.addEventListener('click', event => removeCarrier(event.target.dataset.removeCarrier));
            });

            document.querySelectorAll('[data-remove-tier]').forEach(button => {
                button.addEventListener('click', event => removeTier(event.target.dataset.removeTier));
            });
        }

        async function submitTable() {
            const payload = buildPayload();
            if (!payload.Carriers.length || !payload.Tiers.length || !payload.Plans.length) {
                alert('Add at least one carrier, one tier, and one plan before saving.');
                return;
            }

            document.getElementById('submitButton').disabled = true;
            statusMessage.textContent = 'Saving plan setup...';

            try {
                const result = await saveEmployerPlanSetup(employerID, payload);
                statusMessage.textContent = result.message || 'Plan setup saved.';
                alert('Plan setup saved.');
                await loadPlanSetup();
            } catch (error) {
                console.error('Error saving plan setup:', error);
                statusMessage.textContent = 'Could not save plan setup.';
                alert(`Could not save plan setup. ${error.message || ''}`);
            } finally {
                document.getElementById('submitButton').disabled = false;
            }
        }

        function buildPayload() {
            return {
                effectiveDate: effectiveDateInput.value || new Date().toISOString().slice(0, 10),
                Carriers: carriers.map(carrier => ({
                    CarrierID: carrier.id,
                    ClientID: carrier.clientId,
                    CarrierName: carrier.name.trim()
                })).filter(carrier => carrier.CarrierName),
                Tiers: tiers.map(tier => ({
                    TierID: tier.id,
                    ClientID: tier.clientId,
                    TierName: tier.name.trim(),
                    MaxAge: tier.maxAge,
                    MinAge: tier.minAge
                })).filter(tier => tier.TierName),
                Plans: buildPlanPayload()
            };
        }

        function buildPlanPayload() {
            const plans = [];
            carriers.forEach(carrier => {
                tiers.forEach(tier => {
                    const cell = planCells.get(cellKey(carrier.clientId, tier.clientId));
                    if (!cell) return;
                    plans.push({
                        PlanID: cell.planId,
                        CarrierID: carrier.id !== -1 ? carrier.id : carrier.clientId,
                        TierID: tier.id !== -1 ? tier.id : tier.clientId,
                        FundingAmount: cell.fundingAmount,
                        GrenzFee: cell.grenzFee,
                        GrenzFeeC: cell.grenzFeeC,
                        GrenzFeeS: cell.grenzFeeS,
                        StartDate: cell.startDate || effectiveDateInput.value
                    });
                });
            });
            return plans;
        }

        function cellKey(carrierClientId, tierClientId) {
            return `${carrierClientId}::${tierClientId}`;
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const value = String(dateString);
            if (/^\d{4}-\d{2}-\d{2}/.test(value)) return value.slice(0, 10);
            const parsed = new Date(value);
            return Number.isNaN(parsed.getTime()) ? '' : parsed.toISOString().slice(0, 10);
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }
    </script>
    <script src="app-shell.js?v=20260606a" defer></script>
</body>
</html>
