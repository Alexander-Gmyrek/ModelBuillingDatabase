<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Companies - Billing Database</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }

        main {
            padding: 20px;
        }

        .search-container {
            margin-bottom: 20px;
        }

        #searchInput {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .add-company-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .add-company-button:hover {
            background: #0056b3;
        }

        #companyList {
            list-style-type: none;
            padding: 0;
        }

        #companyList li {
            background-color: white;
            margin-bottom: 10px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            justify-items: start;
        }

        #companyList li:hover {
            background-color: #f1f1f1;
        }

        #companyList li button {
            float: right;
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        #companyList li button:hover {
            background-color: #c82333;
        }
    </style>
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <header>
        <h1>Billing Database</h1>
    </header>
    <main>
        <h2>Companies</h2>
        <p class="app-page-intro">Choose a company to review employees, plans, and monthly billing reports. Add a company when starting a new employer setup.</p>
        <div class="search-container">
            <input type="search" id="searchInput" placeholder="Search companies by name">
            <a href="addcompany.html" class="add-company-button">Add Company</a>
        </div>
        <p id="companyStatus" class="app-message">Loading companies...</p>
        <ul id="companyList"></ul>
    </main>

    <script type="module">
        import {
            getAllEmployers,
            searchTableByName,
            deleteEmployer
        } from './apiFunctions.js';
    
        document.addEventListener('DOMContentLoaded', () => {
            const companyStatus = document.getElementById('companyStatus');

            async function fetchAndDisplayCompanies() {
                try {
                    companyStatus.textContent = 'Loading companies...';
                    const companies = await getAllEmployers();
                    displayCompanies(companies);
                } catch (error) {
                    console.error('Error fetching companies:', error);
                    companyStatus.textContent = 'Could not load companies. Check the setup page and make sure the app is running.';
                }
            }
    
            function displayCompanies(companies) {
                const companyList = document.getElementById('companyList');
                companyList.innerHTML = '';
                if (!companies || companies.length === 0) {
                    companyStatus.textContent = 'No companies yet. Add a company to begin setup.';
                    return;
                }
                companyStatus.textContent = `${companies.length} compan${companies.length === 1 ? 'y' : 'ies'} found.`;
                companies.forEach(company => {
                    const listItem = document.createElement('li');
                    const companyName = document.createElement('strong');
                    companyName.textContent = company.EmployerName || 'Unnamed Company';
                    listItem.appendChild(companyName);
                    listItem.dataset.name = (company.EmployerName || '').toLowerCase();
                    listItem.dataset.id = company.EmployerID;
                    listItem.addEventListener('click', () => {
                        navigateToCompany(company.EmployerID);
                    });
                    const deleteButton = document.createElement('button');
                    deleteButton.textContent = 'Delete';
                    deleteButton.dataset.danger = 'true';
                    deleteButton.addEventListener('click', (event) => {
                        event.stopPropagation(); // Prevent the click event from propagating to the list item
                        const confirmed = confirm(`Delete ${company.EmployerName}? This will remove related records from the database.`);
                        if (confirmed) {
                            deleteEmployer(company.EmployerID)
                                .then(() => fetchAndDisplayCompanies())
                                .catch(error => {
                                    console.error('Error deleting company:', error);
                                    alert('Could not delete the company.');
                                });
                        }
                    });
                    listItem.appendChild(deleteButton);
                    companyList.appendChild(listItem);
                    
                    
                });
            }
    
            async function navigateToCompany(companyId) {
                window.location.href = `company1.html?id=${companyId}`;
            }
    
            function debounce(func, delay) {
                let timeout;
                return function(...args) {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => func.apply(this, args), delay);
                };
            }
    
            async function filterCompanies() {
                const searchInput = document.getElementById('searchInput').value.toLowerCase();
                try {
                    if (!searchInput) {
                        await fetchAndDisplayCompanies();
                        return;
                    }
                    companyStatus.textContent = 'Searching companies...';
                    const companies = await searchTableByName("employer", searchInput);
                    displayCompanies(companies);
                } catch (error) {
                    console.error('Error searching companies:', error);
                }
            }
    
            const debouncedFilterCompanies = debounce(filterCompanies, 250);
    
            document.getElementById('searchInput').addEventListener('input', debouncedFilterCompanies);
    
            fetchAndDisplayCompanies();
        });
    </script>
    
    <script src="app-shell.js" defer></script>
</body>
</html>
